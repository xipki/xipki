name: ${XIPKI_COMPOSE_PROJECT:-xipki-ocsp}

services:
  role-init:
    image: ${XIPKI_IMAGE_PREFIX}/xipki:${XIPKI_VERSION}
    user: "0:0"
    entrypoint: ["xipki-role-init"]
    environment:
      XIPKI_ROLE: ocsp
      XIPKI_DEPLOYMENT_NAME: ${XIPKI_DEPLOYMENT_NAME}
      XIPKI_DB_HOST: ${XIPKI_DB_HOST}
      XIPKI_DB_PORT: ${XIPKI_DB_PORT}
      XIPKI_DB_USER: ${XIPKI_DB_USER}
      XIPKI_CA_DB_NAME: ${XIPKI_CA_DB_NAME}
      XIPKI_OCSP_DB_NAME: ${XIPKI_OCSP_DB_NAME}
    volumes:
      - ./.state/seed:/seed:ro
      - role-state:/var/lib/xipki
    secrets:
      - ocsp_db_password
    restart: "no"

  ocsp:
    image: ${XIPKI_IMAGE_PREFIX}/xipki:${XIPKI_VERSION}
    environment:
      XIPKI_ROLE: ocsp
    volumes:
      - role-state:/var/lib/xipki
    ports:
      - "${XIPKI_BIND_ADDRESS:-0.0.0.0}:${XIPKI_OCSP_HTTP_PORT:-18080}:8080"
    depends_on:
      role-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  role-state:

secrets:
  ocsp_db_password:
    file: ./.state/secrets/ocsp_db_password
